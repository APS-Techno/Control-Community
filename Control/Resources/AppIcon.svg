<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="plasma1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6ec7"/>
      <stop offset="100%" style="stop-color:#ff2d95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="5" y="5" width="110" height="110" rx="8" fill="#0e2a4a" stroke="#3498db" stroke-width="2"/>
  <!-- Grid -->
  <line x1="5" y1="30" x2="115" y2="30" stroke="#1e5f8a" stroke-width="0.5"/>
  <line x1="5" y1="55" x2="115" y2="55" stroke="#1e5f8a" stroke-width="0.5"/>
  <line x1="5" y1="80" x2="115" y2="80" stroke="#1e5f8a" stroke-width="0.5"/>
  <line x1="30" y1="5" x2="30" y2="115" stroke="#1e5f8a" stroke-width="0.5"/>
  <line x1="60" y1="5" x2="60" y2="115" stroke="#1e5f8a" stroke-width="0.5"/>
  <line x1="90" y1="5" x2="90" y2="115" stroke="#1e5f8a" stroke-width="0.5"/>
  <!-- Chamber -->
  <rect x="22" y="28" width="76" height="52" rx="4" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <!-- Magnetrons -->
  <rect x="33" y="32" width="14" height="7" rx="2" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="2"/>
  <rect x="53" y="32" width="14" height="7" rx="2" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="2"/>
  <rect x="73" y="32" width="14" height="7" rx="2" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="2"/>
  <!-- Plasma flows - magenta -->
  <line x1="38" y1="39" x2="34" y2="55" stroke="url(#plasma1)" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <line x1="40" y1="39" x2="40" y2="56" stroke="url(#plasma1)" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="42" y1="39" x2="46" y2="55" stroke="url(#plasma1)" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <line x1="58" y1="39" x2="54" y2="55" stroke="url(#plasma1)" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <line x1="60" y1="39" x2="60" y2="56" stroke="url(#plasma1)" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="62" y1="39" x2="66" y2="55" stroke="url(#plasma1)" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <line x1="78" y1="39" x2="74" y2="55" stroke="url(#plasma1)" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <line x1="80" y1="39" x2="80" y2="56" stroke="url(#plasma1)" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="82" y1="39" x2="86" y2="55" stroke="url(#plasma1)" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <!-- Plasma glow zones -->
  <ellipse cx="40" cy="48" rx="8" ry="10" fill="#ff6ec7" opacity="0.08"/>
  <ellipse cx="60" cy="48" rx="8" ry="10" fill="#ff6ec7" opacity="0.08"/>
  <ellipse cx="80" cy="48" rx="8" ry="10" fill="#ff6ec7" opacity="0.08"/>
  <!-- Stage -->
  <rect x="32" y="67" width="56" height="5" rx="2" fill="#00e5ff" opacity="0.2" stroke="#00e5ff" stroke-width="2"/>
  <!-- Pump -->
  <line x1="60" y1="80" x2="60" y2="93" stroke="#00e5ff" stroke-width="2.5"/>
  <rect x="46" y="91" width="28" height="12" rx="3" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <!-- APS text -->
  <text x="60" y="15" text-anchor="middle" fill="#00e5ff" font-size="9" font-weight="bold" font-family="monospace" letter-spacing="3">APS</text>
</svg>
